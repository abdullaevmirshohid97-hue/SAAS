; =============================================================================
; Clary — qo'lda yoziladigan PJSIP akkauntlari (/etc/asterisk/pjsip_local.conf)
; =============================================================================
; install.sh bu faylni FAQAT bir marta (yo'q bo'lsa) yaratadi va parollarni
; generatsiya qiladi — keyingi ishga tushirishlarda TEGMAYDI.
; O'zgartirgandan keyin: asterisk -rx "module reload res_pjsip.so"
;
; Bulutli ATS (har klinikaning Uztelecom IP-telefoniyasi) bu yerda EMAS — u
; Clary ilovasida sozlanadi va pjsip_clary.conf ga avtomatik yoziladi.
; =============================================================================

; =============================================================================
; A) GoIP GSM-shlyuz liniyalari (AI qabulxona uchun SIM)
; =============================================================================
; Har liniya (SIM) alohida akkaunt. GoIP veb-panelida:
;   Configurations → Basic VoIP → Config Mode: "Config by Line"
;   Line N: SIP Registrar = <SERVER_PUBLIC_IP>, Phone Number = goipN,
;           Authentication ID = goipN, Password = <parol>
;   Call In → Line N: "Forward to VoIP" (kiruvchi GSM qo'ng'iroq → SIP), raqam: clary
;   Media → Codec: PCMU, PCMA (G.711)
; GoIP NAT orqasida — shuning uchun rewrite_contact / rtp_symmetric / force_rport.

[goip-template](!)
type=endpoint
context=from-goip
disallow=all
allow=ulaw,alaw
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
dtmf_mode=rfc4733
send_rpid=yes
trust_id_inbound=yes

[goip-aor-template](!)
type=aor
max_contacts=1
remove_existing=yes
qualify_frequency=60

[goip1](goip-template)
auth=goip1-auth
aors=goip1
[goip1-auth]
type=auth
auth_type=userpass
username=goip1
password=<GOIP1_PAROL>
[goip1](goip-aor-template)

[goip2](goip-template)
auth=goip2-auth
aors=goip2
[goip2-auth]
type=auth
auth_type=userpass
username=goip2
password=<GOIP2_PAROL>
[goip2](goip-aor-template)

; goip3, goip4 ... — xuddi shunday nusxa ko'chiring

; =============================================================================
; B) Qo'lda operator trunk'i (faqat AI qabulxona uchun; bulutli ATS'da KERAK EMAS)
; =============================================================================
; Operator beradi: SIP server (host), login, parol, raqam(lar) (DID).
; Ilovada liniya kaliti = DID (raqamning oxirgi 9 raqami).

;[uztelecom]
;type=registration
;outbound_auth=uztelecom-auth
;server_uri=sip:<SIP_HOST>
;client_uri=sip:<LOGIN>@<SIP_HOST>
;contact_user=<LOGIN>
;retry_interval=60
;expiration=300
;line=yes
;endpoint=uztelecom

;[uztelecom-auth]
;type=auth
;auth_type=userpass
;username=<LOGIN>
;password=<PAROL>

;[uztelecom]
;type=aor
;contact=sip:<SIP_HOST>
;qualify_frequency=60

;[uztelecom](clary-trunk)
;context=from-trunk
;outbound_auth=uztelecom-auth
;aors=uztelecom
;from_user=<LOGIN>
;from_domain=<SIP_HOST>

; Operator ;line= parametrini qaytarmasa — IP bo'yicha aniqlash. DIQQAT: bulutli
; ATS ham shu operator serveri bilan ishlasa QO'SHMANG (to'qnashadi).
;[uztelecom]
;type=identify
;endpoint=uztelecom
;match=<SIP_HOST yoki IP>
