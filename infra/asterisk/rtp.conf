; Clary: RTP portlari — firewall'da ham shu oraliqni oching (UDP).
; Har faol qo'ng'iroqqa 2 port (kanal); 1000 port ≈ 250 bir vaqtdagi qo'ng'iroq.
[general]
rtpstart=10000
rtpend=10999
; Clary softfoni (WebRTC) ICE talab qiladi
icesupport=yes
; Server NAT orqasida bo'lsa (ommaviy IP interfeysda emas) — ochiq STUN:
;stunaddr=stun.l.google.com:19302
