; =============================================================================
; Clary — dialplan (AI qabulxona + bulutli ATS)
; =============================================================================
; Bu fayl install.sh tomonidan HAR SAFAR yangilanadi — o'zgartirmang.
; Har klinikaning ATS konteksti (t-<kod>-*) extensions_clary.conf da — uni
; voice-agent Clary API'dan avtomatik yozadi (PBX_ENABLED=true).
;
; AI qabulxona oqimi:
;   kiruvchi (GoIP SIM, qo'lda SIP trunk yoki bulutli ATS'da hech kim olmasa)
;     → [clary-ai]: UUID → voice-agent'ga ro'yxat (CURL) → AudioSocket (AI suhbat)
;     → keyingi amal: hangup | transfer:group | transfer:<raqam>[:<endpoint>] | fallback
;   voice-agent ishlamasa → ATS guruhi yana jiringlaydi yoki zaxira ovoz (clary/fallback).
;
; Bulutli ATS oqimi (extensions_clary.conf):
;   operator → t-<kod>-in: stol telefonlari + Clary softfonlari birdan jiringlaydi
;     → hech kim olmasa (yoki ish vaqtidan tashqari) → [clary-ai]
;   ichki raqam → t-<kod>-ext: ichki (201..899), tashqi (faqat O'zbekiston), 101–104, 112
;   har qo'ng'iroq yakunida [clary-pbx-hangup] → voice-agent → Clary (jurnal + yozuv)
;
; Kerakli modullar (Ubuntu asterisk paketida bor): res_audiosocket, app_audiosocket,
; func_curl, func_shell, func_uri, func_groupcount, app_mixmonitor, res_pjsip,
; res_pjsip_outbound_registration, res_http_websocket, res_pjsip_transport_websocket, res_srtp.
; =============================================================================

[globals]
AGENT_HTTP=127.0.0.1:7071
AGENT_AUDIOSOCKET=127.0.0.1:9092

; --- GoIP: GSM'dan kelgan qo'ng'iroq ----------------------------------------
[from-goip]
exten => clary,1,Goto(clary-ai,s,1)
exten => s,1,Goto(clary-ai,s,1)
exten => _X.,1,Goto(clary-ai,s,1)
exten => _+X.,1,Goto(clary-ai,s,1)

; --- Qo'lda yozilgan operator SIP trunk: EXTEN = chaqirilgan raqam (DID) ------
[from-trunk]
exten => _X.,1,Set(__CLARY_DID=${EXTEN})
 same => n,Goto(clary-ai,s,1)
exten => _+X.,1,Set(__CLARY_DID=${EXTEN})
 same => n,Goto(clary-ai,s,1)

; --- AI qabulxona ------------------------------------------------------------
; Bulutli ATS'dan kelganda: CLARY_TENANT, CLARY_LINE (trunk-<kod>), CALL_UUID tayyor.
[clary-ai]
exten => s,1,NoOp(Clary AI: ${CALLERID(num)} -> ${CHANNEL(endpoint)} DID=${CLARY_DID})
 same => n,Answer()
 same => n,Wait(0.4)
 same => n,Set(ORIG_EP=${CHANNEL(endpoint)})
 same => n,ExecIf($["${CLARY_LINE}" != ""]?Set(ORIG_EP=${CLARY_LINE}))
 same => n,GotoIf($["${CALL_UUID}" != ""]?uuid)
 same => n,Set(CALL_UUID=${SHELL(cat /proc/sys/kernel/random/uuid | tr -d '\n')})
 same => n(uuid),Set(CLARY_AI=1)
 same => n,Set(CURLOPT(conntimeout)=2)
 same => n,Set(CURLOPT(httptimeout)=3)
 same => n,Set(REG=${CURL(http://${AGENT_HTTP}/calls/register?uuid=${CALL_UUID}&line=${ORIG_EP}&did=${URIENCODE(${CLARY_DID})}&from=${URIENCODE(${CALLERID(num)})})})
 same => n,GotoIf($["${REG}" != "OK"]?fallback,1)
 same => n,AudioSocket(${CALL_UUID},${AGENT_AUDIOSOCKET})
 same => n,Set(NEXT=${CURL(http://${AGENT_HTTP}/calls/next?uuid=${CALL_UUID})})
 same => n,GotoIf($["${NEXT}" = "transfer:group"]?group,1)
 same => n,GotoIf($["${NEXT:0:9}" = "transfer:"]?transfer,1)
 same => n,GotoIf($["${NEXT}" = "fallback"]?fallback,1)
 same => n,Hangup()

; Bulutli ATS: AI odamga ulaydi → klinikaning qabulxona guruhi
exten => group,1,NoOp(AI → ATS guruhi: ${CLARY_TENANT})
 same => n,GotoIf($["${CLARY_TENANT}" = ""]?transfer,fail)
 same => n,Goto(t-${CLARY_TENANT}-in,xfer,1)

; Odamga ulash: NEXT = transfer:<raqam>[:<endpoint>]
; Bitta SIM'li GoIP'da (liniya band) ishlamaydi — TRANSFER_ENDPOINT=goip2 yoki trunk.
exten => transfer,1,Set(XFER_NUM=${CUT(NEXT,:,2)})
 same => n,Set(XFER_EP=${CUT(NEXT,:,3)})
 same => n,ExecIf($["${XFER_EP}" = ""]?Set(XFER_EP=${ORIG_EP}))
 same => n,NoOp(Xodimga ulash: ${XFER_NUM} via ${XFER_EP})
 same => n,Dial(PJSIP/${XFER_NUM}@${XFER_EP},30,g)
 same => n,GotoIf($["${DIALSTATUS}" = "ANSWER"]?done)
 same => n(fail),Playback(clary/transfer_fail)
 same => n(done),Hangup()

; voice-agent ishlamasa: ATS qo'ng'irog'i — guruh yana jiringlaydi; aks holda zaxira ovoz
exten => fallback,1,GotoIf($["${CLARY_TENANT}" != "" & "${CLARY_XFER}" != "1"]?t-${CLARY_TENANT}-in,xfer,1)
 same => n,Playback(clary/fallback)
 same => n,Hangup()

exten => h,1,NoOp(Clary AI tugadi: ${CALL_UUID} ${HANGUPCAUSE})

; =============================================================================
; Bulutli ATS — umumiy qismlar
; =============================================================================

; ${ARG1} endpoint'ning onlayn qurilmalarini CLARY_T ga qo'shadi (& bilan).
; Bo'sh element Dial()ni butunlay buzadi — shuning uchun faqat bo'sh bo'lmasa.
[clary-pbx-append]
exten => s,1,Set(CLARY_C=${PJSIP_DIAL_CONTACTS(${ARG1})})
 same => n,GotoIf($[${LEN(${CLARY_C})} = 0]?done)
 same => n,Set(CLARY_T=${CLARY_T}${IF($[${LEN(${CLARY_T})} > 0]?&)}${CLARY_C})
 same => n(done),Return()

; Qo'ng'iroq yakuni (hangup handler) → voice-agent: jurnal + yozuvni Clary'ga yuklash
[clary-pbx-hangup]
exten => s,1,NoOp(Clary ATS yakuni: ${CLARY_TENANT} ${CALL_UUID} ${DIALSTATUS})
 same => n,GotoIf($["${CALL_UUID}" = "" | "${CLARY_TENANT}" = ""]?done)
 same => n,ExecIf($["${CLARY_REC}" = "1"]?StopMixMonitor())
 same => n,Set(CLARY_P=${CLARY_PEER})
 same => n,ExecIf($["${CLARY_P}" = ""]?Set(CLARY_P=${DIALEDPEERNAME}))
 same => n,Set(CURLOPT(conntimeout)=2)
 same => n,Set(CURLOPT(httptimeout)=3)
 same => n,Set(CLARY_R=${CURL(http://${AGENT_HTTP}/pbx/cdr?uuid=${CALL_UUID}&tenant=${CLARY_TENANT}&dir=${CLARY_DIR}&from=${URIENCODE(${CLARY_FROM})}&to=${URIENCODE(${CLARY_TO})}&status=${DIALSTATUS}&peer=${URIENCODE(${CLARY_P})}&start=${CLARY_START}&end=${EPOCH}&answered=${ANSWEREDTIME}&ai=${CLARY_AI}&xfer=${CLARY_XFER}&rec=${CLARY_REC}&cause=${HANGUPCAUSE})})
 same => n(done),Return()

; Har klinika konteksti — voice-agent yozadi (qo'lda tahrirlamang)
#tryinclude extensions_clary.conf
