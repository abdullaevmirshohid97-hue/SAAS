; =============================================================================
; Clary AI qabulxona — dialplan
; =============================================================================
; Oqim:
;   kiruvchi qo'ng'iroq (GoIP SIM yoki SIP DID)
;     → [clary-ai]: UUID → voice-agent'ga ro'yxat (CURL) → AudioSocket (AI suhbat)
;     → suhbat tugagach voice-agent'dan keyingi amal: hangup | transfer:<raqam>[:<endpoint>] | fallback
;   voice-agent ishlamasa → zaxira ovoz (clary/fallback) va go'shak.
; Kerakli modullar (Ubuntu asterisk paketida bor): res_audiosocket, app_audiosocket,
; func_curl, func_shell, func_uri, res_pjsip.
; =============================================================================

[globals]
AGENT_HTTP=127.0.0.1:7071
AGENT_AUDIOSOCKET=127.0.0.1:9092

; --- GoIP: GSM'dan kelgan qo'ng'iroq ----------------------------------------
[from-goip]
exten => clary,1,Goto(clary-ai,s,1)
exten => s,1,Goto(clary-ai,s,1)
exten => _X.,1,Goto(clary-ai,s,1)
exten => _+X.,1,Goto(clary-ai,s,1)

; --- Operator SIP trunk: EXTEN = chaqirilgan raqam (DID) --------------------
[from-trunk]
exten => _X.,1,Set(__CLARY_DID=${EXTEN})
 same => n,Goto(clary-ai,s,1)
exten => _+X.,1,Set(__CLARY_DID=${EXTEN})
 same => n,Goto(clary-ai,s,1)

; --- AI qabulxona ------------------------------------------------------------
[clary-ai]
exten => s,1,NoOp(Clary AI: ${CALLERID(num)} -> ${CHANNEL(endpoint)} DID=${CLARY_DID})
 same => n,Answer()
 same => n,Wait(0.4)
 same => n,Set(ORIG_EP=${CHANNEL(endpoint)})
 same => n,Set(CALL_UUID=${SHELL(cat /proc/sys/kernel/random/uuid | tr -d '\n')})
 same => n,Set(CURLOPT(conntimeout)=2)
 same => n,Set(CURLOPT(httptimeout)=3)
 same => n,Set(REG=${CURL(http://${AGENT_HTTP}/calls/register?uuid=${CALL_UUID}&line=${ORIG_EP}&did=${URIENCODE(${CLARY_DID})}&from=${URIENCODE(${CALLERID(num)})})})
 same => n,GotoIf($["${REG}" != "OK"]?fallback,1)
 same => n,AudioSocket(${CALL_UUID},${AGENT_AUDIOSOCKET})
 same => n,Set(NEXT=${CURL(http://${AGENT_HTTP}/calls/next?uuid=${CALL_UUID})})
 same => n,GotoIf($["${NEXT:0:9}" = "transfer:"]?transfer,1)
 same => n,GotoIf($["${NEXT}" = "fallback"]?fallback,1)
 same => n,Hangup()

; Odamga ulash: NEXT = transfer:<raqam>[:<endpoint>]
; Bitta SIM'li GoIP'da (liniya band) ishlamaydi — TRANSFER_ENDPOINT=goip2 yoki trunk.
exten => transfer,1,Set(XFER_NUM=${CUT(NEXT,:,2)})
 same => n,Set(XFER_EP=${CUT(NEXT,:,3)})
 same => n,ExecIf($["${XFER_EP}" = ""]?Set(XFER_EP=${ORIG_EP}))
 same => n,NoOp(Xodimga ulash: ${XFER_NUM} via ${XFER_EP})
 same => n,Dial(PJSIP/${XFER_NUM}@${XFER_EP},30,g)
 same => n,GotoIf($["${DIALSTATUS}" = "ANSWER"]?done)
 same => n,Playback(clary/transfer_fail)
 same => n(done),Hangup()

exten => fallback,1,Playback(clary/fallback)
 same => n,Hangup()

exten => h,1,NoOp(Clary AI tugadi: ${CALL_UUID} ${HANGUPCAUSE})
