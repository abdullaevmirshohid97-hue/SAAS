# =============================================================================
# Clary — coturn (TURN/STUN) — Clary softfoni qattiq NAT/firewall ortida bo'lsa
# =============================================================================
# install.sh bu faylni /etc/turnserver.conf ga yozadi va <...> ni almashtiradi.
# API .env.local dagi TURN_SECRET shu static-auth-secret bilan BIR XIL bo'lsin.
# Login vaqtinchalik (12 soat): API /telephony/me har safar yangisini beradi.
# =============================================================================
listening-port=3478
fingerprint
use-auth-secret
static-auth-secret=<TURN_SECRET>
realm=<PBX_DOMAIN>
total-quota=300
stale-nonce=600
no-multicast-peers
no-cli
no-tlsv1
no-tlsv1_1
min-port=50000
max-port=50999
# Ichki/xizmat tarmoqlariga relay taqiqlangan (SSRF'dan himoya)
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
log-file=/var/log/turnserver.log
simple-log
