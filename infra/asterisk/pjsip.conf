; =============================================================================
; Clary — Asterisk PJSIP (Asterisk 18/20; Ubuntu 22.04 / 24.04 paketi)
; =============================================================================
; Bu fayl install.sh tomonidan HAR SAFAR yangilanadi — o'zgartirmang.
;   pjsip_local.conf  — qo'lda yoziladigan akkauntlar (GoIP, qo'lda trunk);
;                       bir marta yaratiladi, keyin install.sh TEGMAYDI
;   pjsip_clary.conf  — bulutli ATS (har klinika trunk'i va ichki raqamlari);
;                       voice-agent Clary API'dan AVTOMATIK yozadi (PBX_ENABLED)
; Batafsil: docs/ai-reception/02-server-asterisk.md, 05-bulut-ats.md
; =============================================================================

[global]
type=global
user_agent=Clary
; Ommaviy IP'dan kelgan begona INVITE'larni jim rad etish.
; (Operator trunk'lari ;line= parametri bo'yicha — u har doim birinchi tekshiriladi)
endpoint_identifier_order=ip,username,anonymous
; Ichki raqamlar HA1 (md5) bilan — realm softfon (JsSIP) bilan bir xil bo'lishi SHART
default_realm=clary
; TCP/WebSocket ulanishlari uzilib qolmasin (NAT)
keep_alive_interval=25

; --- Transport ----------------------------------------------------------------
[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060
; Server NAT orqasida bo'lsa (ommaviy IP interfeysda bo'lmasa) — yoqing:
;external_media_address=<SERVER_PUBLIC_IP>
;external_signaling_address=<SERVER_PUBLIC_IP>
;local_net=10.0.0.0/8
;local_net=192.168.0.0/16

[transport-tcp]
type=transport
protocol=tcp
bind=0.0.0.0:5060
;external_media_address=<SERVER_PUBLIC_IP>
;external_signaling_address=<SERVER_PUBLIC_IP>

; Clary softfoni (brauzer / desktop): wss://<PBX_DOMAIN>/ws → Caddy (TLS) →
; 127.0.0.1:8088/ws (http.conf). bind bu transportda e'tiborga olinmaydi.
[transport-ws]
type=transport
protocol=ws
bind=0.0.0.0

; =============================================================================
; Bulutli ATS shablonlari (pjsip_clary.conf shulardan foydalanadi)
; =============================================================================

; Operator trunk'i (Uztelecom IP-telefoniya va h.k.)
[clary-trunk](!)
type=endpoint
; Faqat IP yoki ;line= bo'yicha aniqlanadi — From'ni soxtalashtirib trunk
; nomidan (parolsiz) qo'ng'iroq qilib bo'lmaydi
identify_by=ip
disallow=all
allow=alaw,ulaw
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
dtmf_mode=rfc4733
trust_id_inbound=yes
send_rpid=no
allow_subscribe=no

; Stol IP telefoni / Zoiper / MicroSIP (UDP yoki TCP 5060)
[clary-ext-phone](!)
type=endpoint
identify_by=username,auth_username
disallow=all
allow=alaw,ulaw
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
dtmf_mode=rfc4733
allow_subscribe=no

; Clary softfoni (WebRTC: DTLS-SRTP + ICE, SIP over WebSocket). transport ko'rsatilmaydi —
; Asterisk WebSocket kontaktini o'zi qayta yozadi va mavjud ulanish orqali yuboradi.
[clary-ext-webrtc](!)
type=endpoint
identify_by=username,auth_username
webrtc=yes
dtls_auto_generate_cert=yes
disallow=all
allow=alaw,ulaw
dtmf_mode=rfc4733
allow_subscribe=no

; =============================================================================
; GoIP GSM-shlyuz va qo'lda yoziladigan trunk'lar — pjsip_local.conf da
; (namuna: infra/asterisk/pjsip_local.conf)
; =============================================================================
#tryinclude pjsip_local.conf

; Bulutli ATS — voice-agent yozadi (qo'lda tahrirlamang)
#tryinclude pjsip_clary.conf
