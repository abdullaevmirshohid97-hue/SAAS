; =============================================================================
; Clary AI qabulxona — Asterisk PJSIP (Asterisk 20+ tavsiya; 18 ham ishlaydi)
; =============================================================================
; Ikki xil ulanish (ikkalasi ham bo'lishi mumkin):
;   A) GSM-shlyuz (GoIP-1/4/8) — har SIM bitta klinikaning AI raqami.
;      Shlyuz klinikada/ofisda turadi va SHU serverga ro'yxatdan o'tadi.
;      Ilovada liniya kaliti = endpoint nomi (goip1, goip2 ...).
;   B) Operator SIP trunk (Uztelecom IP-telefoniya va h.k.) — server operatorga
;      ro'yxatdan o'tadi. Ilovada liniya kaliti = DID (raqamning oxirgi 9 raqami).
; <...> qiymatlarni almashtiring. Parollar uchun: openssl rand -hex 12
; =============================================================================

[global]
type=global
user_agent=Clary-AI
; Ommaviy IP'dan kelgan begona INVITE'larni jim rad etish
endpoint_identifier_order=ip,username,anonymous

; --- Transport ----------------------------------------------------------------
[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060
; Server NAT orqasida bo'lsa (bulut VPS'larda odatda ommaviy IP bevosita) —
; quyidagilarni yoqing:
;external_media_address=<SERVER_PUBLIC_IP>
;external_signaling_address=<SERVER_PUBLIC_IP>
;local_net=10.0.0.0/8
;local_net=192.168.0.0/16

; =============================================================================
; A) GoIP GSM-shlyuz liniyalari
; =============================================================================
; Har liniya (SIM) alohida akkaunt. GoIP veb-panelida:
;   Configurations → Basic VoIP → Config Mode: "Config by Line"
;   Line N: SIP Registrar = <SERVER_PUBLIC_IP>, Phone Number = goipN,
;           Authentication ID = goipN, Password = <parol>
;   Call In → Line N: "Forward to VoIP" (kiruvchi GSM qo'ng'iroq → SIP), raqam: clary
;   Media → Codec: PCMU, PCMA (G.711)
; GoIP NAT orqasida — shuning uchun rewrite_contact / rtp_symmetric / force_rport.

[goip-template](!)
type=endpoint
context=from-goip
disallow=all
allow=ulaw,alaw
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
dtmf_mode=rfc4733
send_rpid=yes
trust_id_inbound=yes

[goip-aor-template](!)
type=aor
max_contacts=1
remove_existing=yes
qualify_frequency=60

[goip1](goip-template)
auth=goip1-auth
aors=goip1
[goip1-auth]
type=auth
auth_type=userpass
username=goip1
password=<GOIP1_PAROL>
[goip1](goip-aor-template)

[goip2](goip-template)
auth=goip2-auth
aors=goip2
[goip2-auth]
type=auth
auth_type=userpass
username=goip2
password=<GOIP2_PAROL>
[goip2](goip-aor-template)

; goip3, goip4 ... — xuddi shunday nusxa ko'chiring

; =============================================================================
; B) Operator SIP trunk (masalan Uztelecom IP-telefoniya)
; =============================================================================
; Operator beradi: SIP server (host), login, parol, raqam(lar) (DID).
; DIQQAT: ba'zi operatorlar SIP'ni faqat o'z tarmog'idagi IP'dan qabul qiladi —
; shartnomada "tashqi (VPS) IP'dan ro'yxatdan o'tish mumkinmi" deb so'rang.

;[uztelecom]
;type=registration
;outbound_auth=uztelecom-auth
;server_uri=sip:<SIP_HOST>
;client_uri=sip:<LOGIN>@<SIP_HOST>
;contact_user=<LOGIN>
;retry_interval=60
;expiration=300
;line=yes
;endpoint=uztelecom

;[uztelecom-auth]
;type=auth
;auth_type=userpass
;username=<LOGIN>
;password=<PAROL>

;[uztelecom]
;type=aor
;contact=sip:<SIP_HOST>
;qualify_frequency=60

;[uztelecom]
;type=endpoint
;context=from-trunk
;disallow=all
;allow=alaw,ulaw
;outbound_auth=uztelecom-auth
;aors=uztelecom
;from_user=<LOGIN>
;from_domain=<SIP_HOST>
;direct_media=no
;rtp_symmetric=yes
;force_rport=yes
;rewrite_contact=yes
;dtmf_mode=rfc4733
;trust_id_inbound=yes

;[uztelecom]
;type=identify
;endpoint=uztelecom
;match=<SIP_HOST yoki IP>
