name: E2E (Playwright)

on:
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  playwright:
    name: Playwright web E2E
    # ubuntu-latest = 26.04 — Playwright u yerda Chromium o'rnata olmaydi (2026-11-25)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.5
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -F @clary/tests-e2e-web exec playwright install --with-deps chromium
      # Clinic va admin dev serverlarini Playwright webServer o'zi ko'taradi
      # (tests/e2e-web/playwright.config.ts). Landing — faqat BASE_URL_LANDING bilan.
      - run: pnpm -F @clary/tests-e2e-web test
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: tests/e2e-web/playwright-report
          retention-days: 14
