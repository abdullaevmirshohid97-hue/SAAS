<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clary</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f8fafc;
        --fg: #0f172a;
        --muted: #64748b;
        --accent: #2563eb;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0b1120;
          --fg: #e2e8f0;
          --muted: #94a3b8;
        }
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--bg);
        color: var(--fg);
        font-family: 'Segoe UI', system-ui, sans-serif;
      }
      .box {
        text-align: center;
        max-width: 360px;
        padding: 24px;
      }
      img {
        width: 72px;
        height: 72px;
        border-radius: 16px;
      }
      h1 {
        font-size: 18px;
        margin: 16px 0 6px;
      }
      p {
        color: var(--muted);
        font-size: 14px;
        margin: 0;
      }
      .spin {
        width: 28px;
        height: 28px;
        margin: 18px auto 0;
        border: 3px solid rgba(37, 99, 235, 0.2);
        border-top-color: var(--accent);
        border-radius: 50%;
        animation: s 0.8s linear infinite;
      }
      @keyframes s {
        to {
          transform: rotate(360deg);
        }
      }
      button {
        margin-top: 18px;
        padding: 9px 20px;
        border: 0;
        border-radius: 8px;
        background: var(--accent);
        color: #fff;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
      }
      [hidden] {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <img src="icon.png" alt="" />
      <div id="loading">
        <h1>Clary</h1>
        <p>Ulanmoqda…</p>
        <div class="spin"></div>
      </div>
      <div id="offline" hidden>
        <h1>Internet aloqasi yo&lsquo;q</h1>
        <p>Clary serveriga ulanib bo&lsquo;lmadi. Internetni tekshiring — aloqa tiklanishi bilan ilova o&lsquo;zi ochiladi.</p>
        <button id="retry" type="button">Qayta urinish</button>
      </div>
    </div>
    <script src="boot.js"></script>
  </body>
</html>
